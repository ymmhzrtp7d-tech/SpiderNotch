name: Bug report
description: Something in SpiderNotch doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make SpiderNotch better! Tip: *Settings → About → Report a bug* fills in your version for you.
        Please check [Troubleshooting](https://github.com/ymmhzrtp7d-tech/SpiderNotch/blob/main/docs/TROUBLESHOOTING.md) first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: "I hovered over the notch and…"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → Appearance
        2. Choose "Pop & float"
        3. …
  - type: input
    id: version
    attributes:
      label: SpiderNotch version
      description: Spider menu → the first line, or Settings → About.
      placeholder: "1.3.0 (202611061200)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.5, MacBook Air M2 (Apple silicon)"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag pictures or a screen recording (⌘⇧5) here. Don't include personal photos you don't want public.
