# shellcheck shell=bash
# ────────────────────────────────────────────────────────────────────
#  Release settings for SpiderNotch. Read by scripts/common.sh.
#  None of these are secrets: they're built into every copy of the app.
# ────────────────────────────────────────────────────────────────────

# The GitHub repository that hosts the code and the releases ("owner/name").
# On GitHub Actions, $GITHUB_REPOSITORY is used instead.
GITHUB_REPO="ymmhzrtp7d-tech/SpiderNotch"

# The update feed. It's attached to the newest GitHub Release, so this address
# always points at the latest stable version. DON'T CHANGE IT after the first
# public release: every installed copy remembers it forever.
FEED_URL="https://github.com/${GITHUB_REPO}/releases/latest/download/appcast.xml"

# The PUBLIC half of the Sparkle update signing key (made with Sparkle's
# generate_keys). The private half lives in the Keychain of the release Mac and
# in the GitHub secret SPARKLE_PRIVATE_KEY. Never put the private key here.
SPARKLE_PUBLIC_KEY="gaVpmQk8uP4jk7Mvby99iSG9zMAyq6OAcHvjnA+a5zw="

# The Sparkle version that gets downloaded into vendor/ (and its fingerprint).
SPARKLE_VERSION="2.10.1"
SPARKLE_SHA256="1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27"
