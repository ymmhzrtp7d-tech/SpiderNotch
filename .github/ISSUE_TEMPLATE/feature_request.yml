name: Feature request
description: An idea for something new in SpiderNotch.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like SpiderNotch to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: When would you use it? What do you do today instead?
  - type: textarea
    id: extra
    attributes:
      label: Sketches, examples, anything else
